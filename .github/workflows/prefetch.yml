# Optional: warms the caches more often than Vercel's once-a-day Hobby cron.
# Add repository secrets SITE_URL (e.g. https://your-app.vercel.app) and CRON_SECRET
# (same value as the CRON_SECRET environment variable in Vercel). Without them this job does nothing.
name: Prefetch football data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  prefetch:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/prefetch
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 70 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/prefetch"
